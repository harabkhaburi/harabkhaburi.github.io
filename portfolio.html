<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portfolio — Hossein Arabkhaburi</title>
<meta name="description" content="Portfolio d'architecture de Hossein Arabkhaburi : agritourisme, école, villa, centre culturel, hôpital." />

<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Space+Grotesk:wght@300..700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --paper:#EEEDE7;
  --ink:#1B1B18;
  --blue:#2547A8;
  --blue-soft:#DDE3F5;
  --mid:#6E6C63;
  --white:#FAFAF7;
  --line:rgba(27,27,24,.12);
  --line2:rgba(27,27,24,.24);
  --serif:'Bricolage Grotesque',system-ui,sans-serif;
  --sans:'Space Grotesk',system-ui,sans-serif;
  --mono:'JetBrains Mono',monospace;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:var(--sans);
  background:var(--paper);
  color:var(--ink);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size:64px 64px;
  opacity:.45;
}

a{color:inherit}

nav{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:50;
  height:74px;
  padding:0 4rem;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(238,237,231,.88);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line2);
}

.logo{
  font-family:var(--mono);
  font-size:.78rem;
  text-decoration:none;
  display:flex;
  gap:.65rem;
  align-items:center;
  letter-spacing:.03em;
}

.logo::before{
  content:"";
  width:8px;
  height:8px;
  background:var(--blue);
}

.back-link{
  font-family:var(--mono);
  font-size:.74rem;
  color:var(--mid);
  text-decoration:none;
}

.back-link:hover{color:var(--blue)}

main{
  position:relative;
  z-index:2;
  padding:9rem 4rem 5rem;
  min-height:calc(100vh - 60px);
}

.hint .touch{display:none}
@media(hover:none){
  .hint .mouse{display:none}
  .hint .touch{display:inline}
}

.wrap{
  max-width:1240px;
  margin:auto;
}

.section-head{
  display:flex;
  flex-wrap:wrap;
  gap:1.5rem;
  align-items:baseline;
  justify-content:space-between;
  padding-bottom:1.5rem;
  margin-bottom:2.5rem;
  border-bottom:1px solid var(--line2);
}

.section-head .title{
  display:flex;
  gap:1.5rem;
  align-items:baseline;
}

.idx{
  font-family:var(--mono);
  color:var(--blue);
  font-size:.85rem;
}

h1{
  font-family:var(--serif);
  font-weight:400;
  font-size:clamp(2rem,3.5vw,3.2rem);
  line-height:1.15;
}

em{font-style:italic;color:var(--blue)}

.btn-sm{
  font-family:var(--mono);
  font-size:.72rem;
  text-decoration:none;
  color:var(--mid);
  background:transparent;
  padding:.6rem 1rem;
  border:1px solid var(--line2);
  border-radius:6px;
  display:inline-flex;
  align-items:center;
  gap:.4rem;
  cursor:pointer;
  transition:.2s;
}

.btn-sm:hover{
  border-color:var(--blue);
  color:var(--blue);
}

.btn-sm:disabled{
  opacity:.35;
  pointer-events:none;
}

/* BOOK */
.stage{
  position:relative;
  padding:2.5rem 1rem;
  border:1px solid var(--line2);
  background:rgba(250,250,247,.55);
}

.book{
  margin:0 auto;
}

.page{
  background:#fff;
  overflow:hidden;
}

.page img{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  background:#fff;
  user-select:none;
  -webkit-user-drag:none;
}

/* soft gutter shadow so the spread reads as a book */
.--landscape .stf__item.--left:not(.--hard)::after,
.--landscape .stf__item.--right:not(.--hard)::after{
  content:"";
  position:absolute;
  top:0;
  width:7%;
  height:100%;
  pointer-events:none;
}
.--landscape .stf__item.--left:not(.--hard)::after{
  right:0;
  background:linear-gradient(to left, rgba(27,27,24,.12), rgba(27,27,24,0));
}
.--landscape .stf__item.--right:not(.--hard)::after{
  left:0;
  background:linear-gradient(to right, rgba(27,27,24,.12), rgba(27,27,24,0));
}

.loading{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:var(--mono);
  font-size:.72rem;
  color:var(--mid);
  pointer-events:none;
}

.stage.ready .loading{display:none}

.controls{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:1rem;
  margin-top:1.5rem;
}

.counter{
  font-family:var(--mono);
  font-size:.75rem;
  color:var(--mid);
  min-width:9ch;
  text-align:center;
}

.hint{
  margin-top:1rem;
  text-align:center;
  font-family:var(--mono);
  font-size:.66rem;
  color:var(--mid);
}

.fallback{
  font-family:var(--mono);
  font-size:.8rem;
  color:var(--mid);
  text-align:center;
  padding:3rem 1rem;
}

footer{
  position:relative;
  z-index:2;
  background:var(--ink);
  color:rgba(238,237,231,.35);
  padding:1.5rem 4rem;
  display:flex;
  justify-content:space-between;
  font-family:var(--mono);
  font-size:.7rem;
}

@media(max-width:800px){
  nav{padding:0 1.5rem}
  main{padding:7.5rem 1rem 3rem}
  .stage{padding:1.2rem .5rem}
  .section-head{margin-bottom:1.5rem}
  footer{flex-direction:column;gap:.5rem;text-align:center;padding:1.5rem}
}

/* Headings: Bricolage Grotesque (no italic) - emphasis by weight instead */
h1,h2{font-weight:500;letter-spacing:-.035em}
h1 em,h2 em,h3 em,.cert-num,.proc-n{font-style:normal}
h1 em,h2 em,h3 em{font-weight:300}
</style>
</head>
<body>

<nav>
  <a class="logo" href="index.html">hossein-arabkhaburi.fr(v18)</a>
  <a class="back-link" href="index.html#projets">← Retour au site</a>
</nav>

<main>
  <div class="wrap">
    <div class="section-head">
      <div class="title">
        <span class="idx">PF</span>
        <h1>Portfolio <em>d'architecture</em></h1>
      </div>
      <a class="btn-sm" href="Hossein-Arabkhaburi-Portfolio.pdf" download>↓ Télécharger le PDF</a>
    </div>

    <div class="stage" id="stage">
      <div class="loading">Chargement du portfolio…</div>
      <div class="book" id="book"></div>
      <noscript>
        <p class="fallback">La lecture interactive nécessite JavaScript.
          <a href="Hossein-Arabkhaburi-Portfolio.pdf">Ouvrir le PDF</a>.</p>
      </noscript>
    </div>

    <div class="controls">
      <button class="btn-sm" id="prev" type="button" aria-label="Page précédente">← Précédent</button>
      <span class="counter" id="counter" aria-live="polite">1 / 38</span>
      <button class="btn-sm" id="next" type="button" aria-label="Page suivante">Suivant →</button>
    </div>
    <p class="hint"><span class="mouse">Cliquez sur un coin, glissez la page ou utilisez les flèches du clavier.</span><span class="touch">Glissez la page du doigt pour la tourner.</span></p>
  </div>
</main>

<footer>
  <span>© 2026 HOSSEIN ARABKHABURI</span>
  <span>NANCY, FRANCE — PORTFOLIO</span>
</footer>

<script src="js/page-flip.browser.js"></script>
<script>
(function(){
  var TOTAL = 38;
  var PATH = function(i){ return 'images/portfolio/page-' + (i < 10 ? '0' : '') + i + '.jpg'; };

  var stage = document.getElementById('stage');
  var book = document.getElementById('book');
  var counter = document.getElementById('counter');
  var prevBtn = document.getElementById('prev');
  var nextBtn = document.getElementById('next');

  // If the library failed to load, fall back to the PDF.
  if (!window.St || !window.St.PageFlip) {
    stage.classList.add('ready');
    book.innerHTML = '<p class="fallback">Impossible d\'afficher le portfolio ici. ' +
      '<a href="Hossein-Arabkhaburi-Portfolio.pdf">Ouvrir le PDF</a>.</p>';
    return;
  }

  // Build pages; only the first few images load immediately, the rest on demand.
  var imgs = [];
  for (var i = 1; i <= TOTAL; i++) {
    var page = document.createElement('div');
    page.className = 'page';
    if (i === 1 || i === TOTAL) page.setAttribute('data-density', 'hard');
    var img = document.createElement('img');
    img.alt = 'Portfolio — page ' + i;
    img.decoding = 'async';
    img.setAttribute('data-src', PATH(i));
    page.appendChild(img);
    book.appendChild(page);
    imgs.push(img);
  }

  function ensureLoaded(index){
    for (var j = index - 2; j <= index + 6; j++) {
      var im = imgs[j];
      if (im && !im.src) im.src = im.getAttribute('data-src');
    }
  }
  ensureLoaded(0);

  var pageFlip = new St.PageFlip(book, {
    width: 800,
    height: 565,
    size: 'stretch',
    minWidth: 280,
    maxWidth: 1000,
    minHeight: 198,
    maxHeight: 707,
    showCover: true,
    usePortrait: true,
    mobileScrollSupport: true,
    maxShadowOpacity: 0.35,
    flippingTime: 800
  });

  pageFlip.loadFromHTML(book.querySelectorAll('.page'));
  stage.classList.add('ready');

  function update(){
    var idx = pageFlip.getCurrentPageIndex();
    var portrait = pageFlip.getOrientation() === 'portrait';
    var label;
    if (portrait || idx === 0 || idx === TOTAL - 1) {
      label = (idx + 1) + ' / ' + TOTAL;
    } else {
      label = (idx + 1) + '–' + Math.min(idx + 2, TOTAL) + ' / ' + TOTAL;
    }
    counter.textContent = label;
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx >= TOTAL - (portrait ? 1 : 2) && idx !== 0;
    ensureLoaded(idx);
  }

  pageFlip.on('flip', update);
  pageFlip.on('changeOrientation', update);
  pageFlip.on('changeState', function(e){
    if (e.data === 'flipping' || e.data === 'user_fold') ensureLoaded(pageFlip.getCurrentPageIndex());
  });
  update();

  prevBtn.addEventListener('click', function(){ pageFlip.flipPrev(); });
  nextBtn.addEventListener('click', function(){ pageFlip.flipNext(); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowLeft') pageFlip.flipPrev();
    if (e.key === 'ArrowRight') pageFlip.flipNext();
  });

  // Quietly preload the remaining pages once everything else is done.
  window.addEventListener('load', function(){
    setTimeout(function(){ for (var k = 0; k < TOTAL; k++) ensureLoaded(k); }, 2500);
  });
})();
</script>

</body>
</html>
